<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get('type') !== 'kiosk') {
        window.location.replace(new URL('guest.html', window.location.href).href);
      }
    })();
  </script>
  <title>주간매점 - 이름을 골라요</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest-kiosk.json">
  <meta name="theme-color" content="#FF9F1C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="주간매점">
  <link rel="apple-touch-icon" href="icons/kiosk-180.png">
  <style>
    @keyframes pulseGlowBanner {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(46, 196, 182, 0); }
      50% { transform: scale(1.015); box-shadow: 0 0 16px rgba(46, 196, 182, 0.4); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(46, 196, 182, 0); }
    }
  </style>
</head>
<body>
  <div class="kiosk-container" id="app-container">
    <!-- 헤더 -->
    <header class="kiosk-header">
      <div class="kiosk-header-top" style="display: flex; justify-content: center; align-items: center; position: relative;">
        <!-- 로고 -->
        <h1 class="kiosk-title" style="padding: 0; line-height: 1; margin: 0;">
          <img src="assets/store-logo.png" alt="주간매점" style="height: 64px; width: auto; display: block; object-fit: contain;">
        </h1>
        <!-- 우측 토글 버튼들 -->
        <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center;">
          <!-- 음성 안내 토글 -->
          <label class="tts-toggle-container" style="cursor: pointer; white-space: nowrap; margin: 0;">
            <span class="tts-switch">
              <input type="checkbox" id="tts-toggle">
              <span class="tts-slider"></span>
            </span>
            <span class="tts-label">음성 안내</span>
          </label>
        </div>
      </div>
    </header>

    <!-- 주문 취소 알림 배너 -->
    <div id="cancellation-banner-container" style="display: none; flex-direction: column; gap: 8px; padding: 12px 20px; background-color: #FFF0F0; border-bottom: 3px solid #FEB2B2; text-align: center;">
    </div>

    <!-- 내 주문 실시간 상태 배너 -->
    <div id="order-status-banner-container" style="display: none; margin: 0; padding: 16px 20px; text-align: center; border-bottom: 4px solid var(--border-color); background-color: #FFFDF9; border-radius: 0;">
      <!-- JS로 동적 생성 -->
    </div>

    <!-- 바디 (스크롤 가능 영역) -->
    <main class="kiosk-body" id="main-content">
      
      <div class="guide-text">
        내 <span>이름(별명)</span>을 찾아서 눌러주세요!
      </div>
      
      <!-- 이용자 목록 그리드 -->
      <div class="grid-container" id="user-grid">
        <!-- JS로 동적 생성 -->
      </div>

      <!-- 게스트 주문 버튼 -->
      <div style="margin-top: 24px; display: flex; flex-direction: column;">
        <button class="btn btn-secondary" id="btn-guest-mode" style="min-height: 64px; font-size: 22px;">
          🟢 배달왔삼 주문
        </button>
      </div>
    </main>

    <!-- 로딩 오버레이 -->
    <div class="overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="overlay-text" id="loading-text">이름 목록을 불러오는 중입니다...</div>
    </div>

    <!-- 에러 모달/오버레이 (초기엔 숨김) -->
    <div class="overlay" id="error-overlay" style="display: none;">
      <div class="error-box" id="error-message">목록을 불러오지 못했습니다.</div>
      <button class="btn btn-primary" id="btn-retry" style="margin-top: 20px; width: 80%;">다시 불러오기</button>
    </div>
  </div>

    <!-- 이용자 상태 친절 안내 모달 -->
    <div class="overlay" id="friendly-notice-overlay" style="display: none; z-index: 1000;">
      <div class="kiosk-modal-box">
        <div class="kiosk-modal-icon" id="friendly-notice-icon">👨‍🍳</div>
        <h2 class="kiosk-modal-title" id="friendly-notice-title">간식 준비 중</h2>
        <p class="kiosk-modal-msg" id="friendly-notice-message">맛있는 간식을 열심히 준비하고 있어요!</p>
        <div class="friendly-notice-menu-box" id="friendly-notice-menu-box" style="display: none;">
          <div class="friendly-notice-menu-label">📋 주문한 간식</div>
          <div class="friendly-notice-menu-items" id="friendly-notice-menu-items"></div>
        </div>
        <div class="kiosk-modal-actions">
          <button class="btn btn-primary" id="btn-friendly-notice-close" style="width: 100%;">확인</button>
        </div>
      </div>
    </div>

    <!-- 직원 3초 롱프레스 긴급 우회 확인 모달 -->
    <div class="overlay" id="staff-bypass-overlay" style="display: none; z-index: 1000;">
      <div class="kiosk-modal-box" style="border: 4px solid #2EC4B6;">
        <div class="kiosk-modal-icon">👨‍🏫</div>
        <h2 class="kiosk-modal-title">직원 / 교사 확인</h2>
        <p class="kiosk-modal-msg" id="staff-bypass-message">
          <strong id="staff-bypass-user-name">OO</strong> 님의 추가 주문을 1회 허용하시겠습니까?
          <br><small style="color: #64748B; font-size: 14px;">(간식을 쏟았거나 특별 배정이 필요한 경우)</small>
        </p>
        <div class="kiosk-modal-actions">
          <button class="btn btn-primary" id="btn-staff-bypass-confirm" style="background-color: #2EC4B6; border-color: #2EC4B6;">네, 1회 허용하기</button>
          <button class="btn btn-secondary" id="btn-staff-bypass-cancel">닫기</button>
        </div>
      </div>
    </div>

    <!-- 키오스크 신규 이용자 셀프 등록 모달 -->
    <div class="overlay" id="kiosk-register-overlay" style="display: none; z-index: 1100;">
      <div class="kiosk-register-modal">
        <div class="kiosk-register-header">
          <div class="kiosk-register-title">
            <span>✨</span> 새 카드 만들기
          </div>
          <button type="button" class="kiosk-register-close" onclick="closeKioskRegisterModal()" aria-label="닫기">&times;</button>
        </div>

        <!-- 실시간 라이브 미리보기 카드 -->
        <div class="kiosk-register-preview-box">
          <div class="kiosk-register-preview-avatar" id="register-preview-avatar">
            <span id="register-preview-emoji">🐻</span>
          </div>
          <div class="kiosk-register-preview-info">
            <span class="kiosk-register-preview-tag">신규 카드 미리보기</span>
            <div class="kiosk-register-preview-name" id="register-preview-name">내 이름(별명)</div>
          </div>
        </div>

        <!-- 별명(이름) 입력 -->
        <div class="kiosk-register-field">
          <label class="kiosk-register-label" for="kiosk-register-nickname">
            <span>이름 또는 별명</span>
            <span class="kiosk-register-hint">최대 15자</span>
          </label>
          <input type="text" id="kiosk-register-nickname" class="kiosk-register-input" placeholder="예: 민수, 꼬부기" maxlength="15" autocomplete="off" oninput="handleRegisterNicknameInput()">
          <div class="kiosk-register-hint" id="kiosk-register-nickname-msg">한글 또는 영문으로 2글자 이상 적어주세요.</div>
        </div>

        <!-- 프로필 꾸미기 (캐릭터 vs 기기 앨범 사진) -->
        <div class="kiosk-register-field">
          <label class="kiosk-register-label">
            <span>프로필 꾸미기</span>
          </label>
          <div class="avatar-type-tabs">
            <button type="button" class="avatar-tab-btn active" id="tab-avatar-emoji" onclick="setAvatarMode('emoji')">
              <span>😊</span> 캐릭터 고르기
            </button>
            <button type="button" class="avatar-tab-btn" id="tab-avatar-photo" onclick="setAvatarMode('photo')">
              <span>🖼️</span> 앨범 사진 선택
            </button>
          </div>

          <!-- 이모티콘 선택 그리드 (12종 귀여운 동물/캐릭터) -->
          <div id="avatar-emoji-section">
            <div class="emoji-picker-grid" id="emoji-picker-grid">
              <!-- JS로 렌더링 -->
            </div>
          </div>

          <!-- 기기 앨범 사진 선택 영역 -->
          <div id="avatar-photo-section" style="display: none;">
            <div class="album-photo-box">
              <input type="file" id="kiosk-photo-input" accept="image/*" style="display: none;" onchange="handleKioskPhotoSelected(this)">
              <button type="button" class="album-photo-btn" onclick="document.getElementById('kiosk-photo-input').click()">
                <span>📷</span> 기기에서 사진 찾기
              </button>
              <div class="kiosk-register-hint" id="kiosk-photo-hint">스마트폰이나 태블릿 앨범에서 사진을 골라주세요.</div>
            </div>
          </div>
        </div>

        <!-- 등록 액션 버튼 -->
        <div class="kiosk-register-actions">
          <button type="button" class="btn-register-cancel" onclick="closeKioskRegisterModal()">취소</button>
          <button type="button" class="btn-register-submit" id="btn-kiosk-register-submit" onclick="submitKioskRegister()">
            ✨ 내 카드 만들기
          </button>
        </div>
      </div>
    </div>

  <!-- 스크립트 참조 -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 이용자 목록 로드 함수
    async function loadUsers() {
      const loadingOverlay = document.getElementById('loading-overlay');
      const errorOverlay = document.getElementById('error-overlay');
      const userGrid = document.getElementById('user-grid');

      // UI 초기화
      loadingOverlay.style.display = 'flex';
      errorOverlay.style.display = 'none';
      userGrid.innerHTML = '';

      try {
        const response = await fetchAPIReadWithRetry('getUsers', { timeoutMs: 30000 });
        
        if (response && response.success && Array.isArray(response.users)) {
          renderUsers(response.users);
          loadingOverlay.style.display = 'none';
        } else {
          throw new Error('API 응답 형식이 유효하지 않습니다.');
        }
      } catch (error) {
        console.error('사용자 목록 불러오기 실패:', error);
        document.getElementById('error-message').textContent = '인터넷 연결이 불안정하거나\n목록을 가져올 수 없습니다.';
        loadingOverlay.style.display = 'none';
        errorOverlay.style.display = 'flex';
      }
    }

    // 키오스크 이용자 주문 상태 및 정책 캐시
    let currentKioskUserStatuses = {};
    let currentKioskOrderPolicy = 'once_daily';
    let currentKioskCooldownMinutes = 60;
    let cachedUsersList = [];
    let pendingBypassUser = null;

    let friendlyNoticeTimer = null;

    function openFriendlyNotice(icon, title, message, itemsText, speakText) {
      if (friendlyNoticeTimer) {
        clearTimeout(friendlyNoticeTimer);
        friendlyNoticeTimer = null;
      }

      const overlay = document.getElementById('friendly-notice-overlay');
      const iconEl = document.getElementById('friendly-notice-icon');
      const titleEl = document.getElementById('friendly-notice-title');
      const msgEl = document.getElementById('friendly-notice-message');
      const menuBoxEl = document.getElementById('friendly-notice-menu-box');
      const menuItemsEl = document.getElementById('friendly-notice-menu-items');

      if (iconEl) iconEl.textContent = icon || 'ℹ️';
      if (titleEl) titleEl.textContent = title || '안내';
      if (msgEl) msgEl.textContent = message || '';

      if (menuBoxEl && menuItemsEl) {
        if (itemsText && String(itemsText).trim() !== '') {
          menuItemsEl.textContent = itemsText;
          menuBoxEl.style.display = 'flex';
        } else {
          menuItemsEl.textContent = '';
          menuBoxEl.style.display = 'none';
        }
      }

      if (overlay) overlay.style.display = 'flex';
      AppState.speak(speakText || message);

      // 6초 후 자동 닫힘 타이머
      friendlyNoticeTimer = setTimeout(() => {
        closeFriendlyNotice();
      }, 6000);
    }

    function closeFriendlyNotice() {
      if (friendlyNoticeTimer) {
        clearTimeout(friendlyNoticeTimer);
        friendlyNoticeTimer = null;
      }
      const overlay = document.getElementById('friendly-notice-overlay');
      if (overlay) overlay.style.display = 'none';
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    function openStaffBypassModal(user) {
      pendingBypassUser = user;
      const overlay = document.getElementById('staff-bypass-overlay');
      const nameEl = document.getElementById('staff-bypass-user-name');
      if (nameEl) nameEl.textContent = user.nickname || '이용자';
      if (overlay) overlay.style.display = 'flex';
      AppState.vibrate([100, 60, 100]);
    }

    function closeStaffBypassModal() {
      pendingBypassUser = null;
      const overlay = document.getElementById('staff-bypass-overlay');
      if (overlay) overlay.style.display = 'none';
    }

    function confirmStaffBypass() {
      if (!pendingBypassUser) return;
      const user = pendingBypassUser;
      sessionStorage.setItem('staffBypass_' + user.userId, 'true');
      sessionStorage.setItem('currentOrderStaffBypass', 'true');
      closeStaffBypassModal();

      if (window.latestPublicOrders) {
        updateKioskUserStatusesFromFeed(window.latestPublicOrders, currentKioskOrderPolicy, currentKioskCooldownMinutes);
      } else {
        currentKioskUserStatuses[user.userId] = { status: 'BYPASSED', badge: '⭐ 추가 주문 허용' };
        applyUserCardStatuses();
      }

      AppState.speak(`${user.nickname} 님의 추가 주문이 허용되었습니다.`);
      AppState.vibrate(60);
    }

    function updateKioskUserStatusesFromFeed(orders, policy, cooldownMinutes) {
      window.latestPublicOrders = orders;
      if (policy) currentKioskOrderPolicy = policy;
      if (cooldownMinutes) currentKioskCooldownMinutes = Number(cooldownMinutes);

      const statusMap = {};
      const now = Date.now();

      if (currentKioskOrderPolicy !== 'unlimited') {
        const userItemsMap = {};

        (orders || []).forEach(order => {
          const userId = String(order.userId || '').trim();
          if (!userId) return;

          const status = String(order.servedYn || '').trim();
          if (status === 'C') return;

          if (!userItemsMap[userId]) {
            userItemsMap[userId] = {
              preparingItems: {},
              readyItems: {},
              servedOrders: [],
              nickname: order.nickname || '회원'
            };
          }
          if (order.nickname) {
            userItemsMap[userId].nickname = order.nickname;
          }

          // 품목 목록 안전 파싱 및 집계
          const itemsToProcess = [];
          let itemsArray = order.items;
          if (typeof itemsArray === 'string' && itemsArray.trim().startsWith('[')) {
            try {
              itemsArray = JSON.parse(itemsArray);
            } catch (e) {}
          }

          if (Array.isArray(itemsArray) && itemsArray.length > 0) {
            itemsArray.forEach(it => {
              const name = String(it.name || it.snackName || '').trim();
              const qty = Number(it.quantity) || 1;
              if (name) itemsToProcess.push({ name, qty });
            });
          } else if (order.snackName) {
            const name = String(order.snackName).trim();
            const qty = Number(order.quantity) || 1;
            if (name) itemsToProcess.push({ name, qty });
          }

          if (status === 'N' || status === 'P') {
            itemsToProcess.forEach(it => {
              userItemsMap[userId].preparingItems[it.name] = (userItemsMap[userId].preparingItems[it.name] || 0) + it.qty;
            });
          } else if (status === 'R') {
            itemsToProcess.forEach(it => {
              userItemsMap[userId].readyItems[it.name] = (userItemsMap[userId].readyItems[it.name] || 0) + it.qty;
            });
          } else if (status === 'Y') {
            userItemsMap[userId].servedOrders.push(order);
          }
        });

        Object.keys(userItemsMap).forEach(userId => {
          if (sessionStorage.getItem('staffBypass_' + userId) === 'true') {
            statusMap[userId] = { status: 'BYPASSED', badge: '⭐ 추가 주문 허용' };
            return;
          }

          const userData = userItemsMap[userId];
          const hasReady = Object.keys(userData.readyItems).length > 0;
          const hasPreparing = Object.keys(userData.preparingItems).length > 0;

          if (hasReady) {
            const itemsText = Object.entries(userData.readyItems)
              .map(([name, qty]) => `${name} ${qty}개`)
              .join(', ');
            statusMap[userId] = {
              status: 'READY',
              badge: '🔔 간식 준비 완료',
              icon: '🔔',
              title: '간식 준비 완료!',
              message: `${userData.nickname}님, 주문하신 간식이 준비되었습니다! 카운터에서 받아가세요 😊`,
              speakText: itemsText ? `${userData.nickname}님, 주문하신 ${itemsText}가 준비되었습니다! 카운터에서 받아가세요.` : `${userData.nickname}님, 주문하신 간식이 준비되었습니다! 카운터에서 받아가세요.`,
              itemsText: itemsText
            };
          } else if (hasPreparing) {
            const itemsText = Object.entries(userData.preparingItems)
              .map(([name, qty]) => `${name} ${qty}개`)
              .join(', ');
            statusMap[userId] = {
              status: 'PREPARING',
              badge: '👨‍🍳 간식 준비 중',
              icon: '👨‍🍳',
              title: '간식 준비 중',
              message: `${userData.nickname}님의 간식을 열심히 준비하고 있어요! 조금만 앉아서 기다려 주세요 😊`,
              speakText: itemsText ? `${userData.nickname}님의 ${itemsText}를 열심히 준비하고 있어요! 조금만 앉아서 기다려 주세요.` : `${userData.nickname}님의 간식을 열심히 준비하고 있어요! 조금만 앉아서 기다려 주세요.`,
              itemsText: itemsText
            };
          } else if (userData.servedOrders.length > 0) {
            const lastServed = userData.servedOrders[userData.servedOrders.length - 1];
            const orderTime = new Date(lastServed.timestamp).getTime();
            const elapsedMinutes = !isNaN(orderTime) ? Math.floor((now - orderTime) / (60 * 1000)) : 999;

            if (currentKioskOrderPolicy === 'once_daily') {
              statusMap[userId] = {
                status: 'SERVED',
                badge: '✅ 오늘 간식 완료',
                icon: '❤️',
                title: '오늘 간식 완료!',
                message: `${userData.nickname}님은 오늘 간식을 맛있게 먹었어요! 내일 또 만나요 ❤️`,
                speakText: `${userData.nickname}님은 오늘 간식을 맛있게 먹었어요! 내일 또 만나요.`
              };
            } else if (currentKioskOrderPolicy === 'cooldown') {
              if (elapsedMinutes < currentKioskCooldownMinutes) {
                const minutesLeft = currentKioskCooldownMinutes - elapsedMinutes;
                statusMap[userId] = {
                  status: 'SERVED',
                  badge: `⏰ ${minutesLeft}분 후 가능`,
                  icon: '⏰',
                  title: '잠시 쉬어가는 시간',
                  message: `${userData.nickname}님은 조금 전 간식을 받았어요. ${minutesLeft}분 뒤에 다시 주문할 수 있어요 ⏰`,
                  speakText: `${userData.nickname}님은 조금 전 간식을 받았어요. ${minutesLeft}분 뒤에 다시 주문할 수 있어요.`
                };
              }
            }
          }
        });
      }

      currentKioskUserStatuses = statusMap;
      applyUserCardStatuses();
    }

    function applyUserCardStatuses() {
      const cards = document.querySelectorAll('.user-card[data-user-id]');
      cards.forEach(card => {
        const userId = card.dataset.userId;
        const info = currentKioskUserStatuses[userId];
        let badgeEl = card.querySelector('.user-card-status-badge');

        card.classList.remove('is-preparing', 'is-ready', 'is-served', 'is-bypassed');

        if (!info) {
          if (badgeEl) badgeEl.remove();
          return;
        }

        if (info.status === 'PREPARING') {
          card.classList.add('is-preparing');
          if (!badgeEl) {
            badgeEl = document.createElement('div');
            badgeEl.className = 'user-card-status-badge';
            card.appendChild(badgeEl);
          }
          badgeEl.textContent = info.badge || '👨‍🍳 간식 준비 중';
        } else if (info.status === 'READY') {
          card.classList.add('is-ready');
          if (!badgeEl) {
            badgeEl = document.createElement('div');
            badgeEl.className = 'user-card-status-badge';
            card.appendChild(badgeEl);
          }
          badgeEl.textContent = info.badge || '🔔 간식 준비 완료';
        } else if (info.status === 'SERVED') {
          card.classList.add('is-served');
          if (!badgeEl) {
            badgeEl = document.createElement('div');
            badgeEl.className = 'user-card-status-badge';
            card.appendChild(badgeEl);
          }
          badgeEl.textContent = info.badge || '✅ 오늘 간식 완료';
        } else if (info.status === 'BYPASSED') {
          card.classList.add('is-bypassed');
          if (!badgeEl) {
            badgeEl = document.createElement('div');
            badgeEl.className = 'user-card-status-badge';
            card.appendChild(badgeEl);
          }
          badgeEl.textContent = info.badge || '⭐ 추가 주문 허용';
        }
      });
    }

    // 이용자 목록 렌더링
    function renderUsers(users) {
      cachedUsersList = users;
      const userGrid = document.getElementById('user-grid');
      userGrid.innerHTML = '';
      
      if (users.length === 0) {
        userGrid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">등록된 이용자가 없습니다. 아래 버튼으로 첫 카드를 만들어보세요!</div>';
        appendAddUserCard(userGrid);
        return;
      }

      users.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card clickable-card';
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${user.nickname || ''} 선택`);
        card.dataset.userId = String(user.userId || '');
        
        // 파스텔 색상 목록 (가독성 좋고 부드러운)
        const colors = ['#FF9F1C', '#2EC4B6', '#118AB2', '#FF5A5F', '#8338EC', '#3A86C8'];
        const colorIndex = Math.abs(String(user.userId || '').split('').reduce((acc, char) => acc + char.charCodeAt(0), 0)) % colors.length;
        const fallbackBgColor = colors[colorIndex];

        const avatarHTML = AppState.renderUserAvatarHtml(user, fallbackBgColor);
        const safeNickname = AppState.escapeHtml(user.nickname);

        // 일반 키오스크에서는 이용자별 1회 주문 한도를 표시한다.
        const safeCreditNum = AppState.escapeHtml(String(user.credit ?? 0));
        card.innerHTML = `
          <div class="user-card-hold-progress"></div>
          ${avatarHTML}
          <div class="user-card-name">${safeNickname}</div>
          <div class="user-card-credit" aria-label="1회 주문 한도 ${safeCreditNum}개">
            <span>1회 한도</span>
            <span class="coin-icon">❤️</span>
            <span class="coin-number">${safeCreditNum}</span>
          </div>
        `;

        // 3초 롱프레스(직원 긴급 우회) 핸들러
        let holdTimeout = null;
        let isHolding = false;
        let holdTriggered = false;
        let touchStartX = 0, touchStartY = 0;

        function startHold(e) {
          const info = currentKioskUserStatuses[user.userId];
          if (!info || (info.status !== 'PREPARING' && info.status !== 'READY' && info.status !== 'SERVED')) return;

          holdTriggered = false;
          isHolding = true;
          touchStartX = e.clientX || (e.touches && e.touches[0]?.clientX) || 0;
          touchStartY = e.clientY || (e.touches && e.touches[0]?.clientY) || 0;
          card.classList.add('is-holding');

          holdTimeout = setTimeout(() => {
            if (isHolding) {
              holdTriggered = true;
              card.classList.remove('is-holding');
              openStaffBypassModal(user);
            }
          }, 3000);
        }

        function endHold() {
          isHolding = false;
          if (holdTimeout) {
            clearTimeout(holdTimeout);
            holdTimeout = null;
          }
          card.classList.remove('is-holding');
        }

        function moveHold(e) {
          if (!isHolding) return;
          const curX = e.clientX || (e.touches && e.touches[0]?.clientX) || 0;
          const curY = e.clientY || (e.touches && e.touches[0]?.clientY) || 0;
          if (Math.abs(curX - touchStartX) > 20 || Math.abs(curY - touchStartY) > 20) {
            endHold();
          }
        }

        card.addEventListener('pointerdown', startHold);
        card.addEventListener('pointerup', endHold);
        card.addEventListener('pointercancel', endHold);
        card.addEventListener('pointerleave', endHold);
        card.addEventListener('pointermove', moveHold);
        
        // 카드 터치/클릭 이벤트 (지터 및 흔들림 보정 지원)
        AppState.bindCardTap(card, () => {
          if (holdTriggered) {
            holdTriggered = false;
            return;
          }

          const info = currentKioskUserStatuses[user.userId];
          if (info && (info.status === 'PREPARING' || info.status === 'READY' || info.status === 'SERVED')) {
            AppState.vibrate(50);
            openFriendlyNotice(info.icon, info.title, info.message, info.itemsText, info.speakText);
            return;
          }

          if (info && info.status === 'BYPASSED') {
            sessionStorage.setItem('currentOrderStaffBypass', 'true');
          } else {
            sessionStorage.removeItem('currentOrderStaffBypass');
          }

          AppState.setSelectedUser(user);
          
          // 피드백 효과 및 음성 안내 후 이동
          AppState.vibrate(60);
          AppState.speak(`${user.nickname} 님을 선택했습니다.`);
          card.style.transform = 'scale(0.92)';
          card.style.borderColor = 'var(--secondary-color)';
          
          setTimeout(() => {
            window.location.href = 'menu.html';
          }, 600); // 음성이 시작될 수 있는 시간적 여유 부여
        });

        userGrid.appendChild(card);
      });

      // 신규 이용자 셀프 등록 카드 맨 끝에 추가
      appendAddUserCard(userGrid);

      applyUserCardStatuses();
    }

    // 신규 이용자 셀프 등록 카드 렌더링
    function appendAddUserCard(container) {
      if (!container) return;
      const addCard = document.createElement('div');
      addCard.className = 'user-card user-card-add';
      addCard.setAttribute('role', 'button');
      addCard.setAttribute('aria-label', '새 카드 만들기');
      addCard.innerHTML = `
        <div class="user-card-add-icon">➕</div>
        <div class="user-card-add-title">새 카드 만들기</div>
        <div class="user-card-add-desc">새로 오셨나요? 등록하기</div>
      `;
      AppState.bindCardTap(addCard, () => {
        AppState.vibrate(40);
        openKioskRegisterModal();
      });
      container.appendChild(addCard);
    }

    // 신규 등록용 이모지 목록 12종
    const KIOSK_REGISTER_EMOJIS = ['🐻', '🐰', '🐶', '🐱', '🐼', '🦁', '🐯', '🐨', '🦊', '🐥', '🐸', '🦄'];
    let registerAvatarMode = 'emoji'; // 'emoji' | 'photo'
    let selectedRegisterEmoji = '🐻';
    let selectedRegisterPhotoDataUrl = '';
    let isKioskRegisterSubmitting = false;

    function openKioskRegisterModal() {
      const modal = document.getElementById('kiosk-register-overlay');
      const nicknameInput = document.getElementById('kiosk-register-nickname');
      const nicknameMsg = document.getElementById('kiosk-register-nickname-msg');
      const photoInput = document.getElementById('kiosk-photo-input');
      const photoHint = document.getElementById('kiosk-photo-hint');

      if (nicknameInput) nicknameInput.value = '';
      if (photoInput) photoInput.value = '';
      if (nicknameMsg) {
        nicknameMsg.textContent = '한글 또는 영문으로 2글자 이상 적어주세요.';
        nicknameMsg.className = 'kiosk-register-hint';
      }
      if (photoHint) photoHint.textContent = '스마트폰이나 태블릿 앨범에서 사진을 골라주세요.';

      selectedRegisterEmoji = '🐻';
      selectedRegisterPhotoDataUrl = '';
      setAvatarMode('emoji');
      renderKioskEmojiGrid();
      updateRegisterLivePreview();

      if (modal) {
        modal.style.display = 'flex';
        setTimeout(() => {
          if (nicknameInput) nicknameInput.focus();
        }, 150);
      }

      AppState.speak('새 카드를 만듭니다. 이름과 캐릭터를 골라주세요.');
    }

    function closeKioskRegisterModal() {
      const modal = document.getElementById('kiosk-register-overlay');
      if (modal) modal.style.display = 'none';
      isKioskRegisterSubmitting = false;
    }

    function renderKioskEmojiGrid() {
      const grid = document.getElementById('emoji-picker-grid');
      if (!grid) return;
      grid.innerHTML = '';
      KIOSK_REGISTER_EMOJIS.forEach(emoji => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'emoji-picker-item' + (emoji === selectedRegisterEmoji ? ' selected' : '');
        item.textContent = emoji;
        item.setAttribute('aria-label', `${emoji} 캐릭터 선택`);
        item.addEventListener('click', () => {
          selectRegisterEmoji(emoji, item);
        });
        grid.appendChild(item);
      });
    }

    function selectRegisterEmoji(emoji, targetEl) {
      selectedRegisterEmoji = emoji;
      const items = document.querySelectorAll('.emoji-picker-item');
      items.forEach(el => el.classList.remove('selected'));
      if (targetEl) targetEl.classList.add('selected');
      AppState.vibrate(25);
      updateRegisterLivePreview();
    }

    function setAvatarMode(mode) {
      registerAvatarMode = mode;
      const tabEmoji = document.getElementById('tab-avatar-emoji');
      const tabPhoto = document.getElementById('tab-avatar-photo');
      const secEmoji = document.getElementById('avatar-emoji-section');
      const secPhoto = document.getElementById('avatar-photo-section');

      if (mode === 'emoji') {
        if (tabEmoji) tabEmoji.classList.add('active');
        if (tabPhoto) tabPhoto.classList.remove('active');
        if (secEmoji) secEmoji.style.display = 'block';
        if (secPhoto) secPhoto.style.display = 'none';
      } else {
        if (tabEmoji) tabEmoji.classList.remove('active');
        if (tabPhoto) tabPhoto.classList.add('active');
        if (secEmoji) secEmoji.style.display = 'none';
        if (secPhoto) secPhoto.style.display = 'block';
      }
      AppState.vibrate(30);
      updateRegisterLivePreview();
    }

    async function handleKioskPhotoSelected(input) {
      const file = input?.files?.[0];
      if (!file) return;

      const photoHint = document.getElementById('kiosk-photo-hint');
      if (photoHint) photoHint.textContent = '사진을 준비하는 중입니다...';

      try {
        const res = await AppState.prepareImageFileForUpload(file, 600, 0.82);
        selectedRegisterPhotoDataUrl = res.dataUrl;
        if (photoHint) photoHint.textContent = '✓ 사진이 선택되었습니다! 아래 미리보기를 확인하세요.';
        AppState.vibrate(40);
        updateRegisterLivePreview();
      } catch (err) {
        console.error('사진 변환 에러:', err);
        alert('사진을 불러오지 못했습니다. 다른 사진을 선택해 주세요.');
        if (photoHint) photoHint.textContent = '사진 선택에 실패했습니다. 다시 시도해 주세요.';
      }
    }

    function handleRegisterNicknameInput() {
      const nicknameInput = document.getElementById('kiosk-register-nickname');
      const nicknameMsg = document.getElementById('kiosk-register-nickname-msg');
      const val = (nicknameInput?.value || '').trim();

      updateRegisterLivePreview();

      if (!val) {
        if (nicknameMsg) {
          nicknameMsg.textContent = '한글 또는 영문으로 2글자 이상 적어주세요.';
          nicknameMsg.className = 'kiosk-register-hint';
        }
        return;
      }

      // 중복 체크
      const isDuplicate = cachedUsersList.some(u => String(u.nickname || '').trim().toLowerCase() === val.toLowerCase());
      if (isDuplicate) {
        if (nicknameMsg) {
          nicknameMsg.textContent = '⚠️ 이미 사용 중인 별명입니다. 목록에서 내 카드를 찾아보세요.';
          nicknameMsg.className = 'kiosk-register-hint warn';
        }
      } else if (val.length < 2) {
        if (nicknameMsg) {
          nicknameMsg.textContent = '별명은 최소 2글자 이상 입력해 주세요.';
          nicknameMsg.className = 'kiosk-register-hint';
        }
      } else {
        if (nicknameMsg) {
          nicknameMsg.textContent = '✓ 멋진 별명이에요! 사용 가능합니다.';
          nicknameMsg.className = 'kiosk-register-hint';
        }
      }
    }

    function updateRegisterLivePreview() {
      const nicknameInput = document.getElementById('kiosk-register-nickname');
      const previewName = document.getElementById('register-preview-name');
      const previewAvatar = document.getElementById('register-preview-avatar');

      const nameVal = (nicknameInput?.value || '').trim();
      if (previewName) previewName.textContent = nameVal || '내 이름(별명)';

      if (!previewAvatar) return;

      if (registerAvatarMode === 'photo' && selectedRegisterPhotoDataUrl) {
        previewAvatar.innerHTML = `<img src="${selectedRegisterPhotoDataUrl}" alt="내 사진 미리보기">`;
        previewAvatar.style.backgroundColor = '#CBD5E0';
      } else {
        previewAvatar.innerHTML = `<span id="register-preview-emoji">${selectedRegisterEmoji}</span>`;
        previewAvatar.style.backgroundColor = '#FF9F1C';
      }
    }

    async function submitKioskRegister() {
      if (isKioskRegisterSubmitting) return;

      const nicknameInput = document.getElementById('kiosk-register-nickname');
      const nickname = (nicknameInput?.value || '').trim();
      const submitBtn = document.getElementById('btn-kiosk-register-submit');

      if (!nickname) {
        alert('이름 또는 별명을 입력해 주세요.');
        nicknameInput?.focus();
        return;
      }
      if (nickname.length < 2) {
        alert('별명은 2글자 이상 입력해 주세요.');
        nicknameInput?.focus();
        return;
      }
      if (nickname.length > 15) {
        alert('별명은 15자 이내로 입력해 주세요.');
        nicknameInput?.focus();
        return;
      }

      // 중복 체크 재확인
      const isDuplicate = cachedUsersList.some(u => String(u.nickname || '').trim().toLowerCase() === nickname.toLowerCase());
      if (isDuplicate) {
        alert(`'${nickname}'(은)는 이미 등록되어 있습니다. 목록에서 내 카드를 찾아보세요!`);
        return;
      }

      isKioskRegisterSubmitting = true;
      const originalBtnText = submitBtn ? submitBtn.textContent : '✨ 내 카드 만들기';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ 카드 만드는 중...';
      }

      try {
        let finalImageUrl = '';

        // 앨범 사진 선택 모드인 경우 먼저 이미지 업로드 수행
        if (registerAvatarMode === 'photo' && selectedRegisterPhotoDataUrl) {
          if (submitBtn) submitBtn.textContent = '📷 사진 저장 중...';
          const uploadRes = await fetchAPI('uploadImage', {
            method: 'POST',
            body: {
              base64Data: selectedRegisterPhotoDataUrl,
              fileName: `kiosk_user_${encodeURIComponent(nickname)}_${Date.now()}.webp`,
              type: 'kioskUser'
            }
          });
          if (uploadRes && uploadRes.success && uploadRes.imageUrl) {
            finalImageUrl = uploadRes.imageUrl;
          } else {
            console.warn('사진 업로드 실패, 기본 이모지로 대체:', uploadRes?.message);
            finalImageUrl = 'emoji:' + selectedRegisterEmoji;
          }
        } else {
          // 이모티콘 모드
          finalImageUrl = 'emoji:' + selectedRegisterEmoji;
        }

        if (submitBtn) submitBtn.textContent = '✨ 이용자 등록 중...';
        const res = await fetchAPI('registerKioskUser', {
          method: 'POST',
          body: {
            nickname: nickname,
            imageUrl: finalImageUrl
          }
        });

        if (res && res.success) {
          AppState.vibrate([100, 60, 100]);
          closeKioskRegisterModal();
          AppState.speak(`환영합니다, ${nickname} 님! 새 카드가 만들어졌어요.`);

          // 목록 갱신 및 신규 등록된 카드 하이라이트
          await loadUsers();

          // 새로 만들어진 카드 찾아서 시각 효과 부여
          setTimeout(() => {
            const newCards = document.querySelectorAll('.user-card[data-user-id]');
            for (const card of newCards) {
              const nameEl = card.querySelector('.user-card-name');
              if (nameEl && nameEl.textContent.trim() === nickname) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.transition = 'all 0.5s ease';
                card.style.borderColor = '#3182CE';
                card.style.boxShadow = '0 0 24px rgba(49, 130, 206, 0.6)';
                card.style.transform = 'scale(1.06)';
                setTimeout(() => {
                  card.style.transform = '';
                  card.style.boxShadow = '';
                }, 2000);
                break;
              }
            }
          }, 300);
        } else {
          alert('카드 만들기에 실패했습니다: ' + (res?.message || '알 수 없는 오류'));
        }
      } catch (error) {
        console.error('키오스크 이용자 등록 오류:', error);
        alert('카드 등록 중 통신 오류가 발생했습니다.');
      } finally {
        isKioskRegisterSubmitting = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnText;
        }
      }
    }


    const CANCELLATION_POLL_MS = 15000;
    let cancellationInterval = null;
    let cancellationPollingActive = false;
    let cancellationPollInFlight = false;

    // 첫 실행 시 기존 취소 내역을 dismiss에 선등록하여 새로고침 시 옛날 취소 건이 다시 보이는 문제 방지
    async function initCancellationAlerts() {
      try {
        const response = await fetchAPIReadWithRetry('getPublicOrderFeed', { timeoutMs: 30000 });
        if (response && response.success && Array.isArray(response.orders)) {
          const existingCancelled = response.orders
            .filter(o => o.servedYn === 'C')
            .map(o => o.orderNo);
          
          const dismissed = JSON.parse(localStorage.getItem('dismissedCancellations') || '[]');
          const newDismissed = Array.from(new Set([...dismissed, ...existingCancelled]));
          localStorage.setItem('dismissedCancellations', JSON.stringify(newDismissed));

          // 내 주문 상태 점검 호출
          checkMyOrderStatus(response.orders);

          // P112: 첫 화면 진입 시에도 즉시 키오스크 카드 주문 상태 시각화 적용
          if (typeof updateKioskUserStatusesFromFeed === 'function') {
            updateKioskUserStatusesFromFeed(response.orders, response.kioskOrderPolicy, response.kioskCooldownMinutes);
          }
        }
      } catch (e) {
        console.warn('취소 알림 초기화 에러:', e);
      }
    }

    function scheduleCancellationPolling(delay = CANCELLATION_POLL_MS) {
      if (cancellationInterval) clearTimeout(cancellationInterval);
      if (!cancellationPollingActive) return;
      cancellationInterval = setTimeout(checkCancelledOrders, delay);
    }

    // 앞선 조회가 끝난 뒤 10초 후 다음 조회를 시작해 느린 API 요청이 겹치지 않게 한다.
    function startCancellationPolling() {
      cancellationPollingActive = true;
      checkCancelledOrders();
    }

    async function checkCancelledOrders() {
      if (!cancellationPollingActive || cancellationPollInFlight) return;
      if (document.hidden) {
        scheduleCancellationPolling();
        return;
      }

      cancellationPollInFlight = true;
      try {
        const response = await fetchAPIReadWithRetry('getPublicOrderFeed', { timeoutMs: 30000 });
        if (response && response.success && Array.isArray(response.orders)) {
          const now = new Date();
          const cancelledOrders = response.orders.filter(o => o.servedYn === 'C');
          
          // 내 주문 상태 점검 호출
          checkMyOrderStatus(response.orders);

          // P111: 키오스크 메인 화면 사용자별 주문 상태/쿨다운 시각화 업데이트 연동
          if (typeof updateKioskUserStatusesFromFeed === 'function') {
            updateKioskUserStatusesFromFeed(response.orders, response.kioskOrderPolicy, response.kioskCooldownMinutes);
          }

          const dismissedList = JSON.parse(localStorage.getItem('dismissedCancellations') || '[]');
          
          const activeCancellations = [];
          let playedSound = false;
          let newlyCancelledNicknames = [];
          
          // 주문번호 단위 중복 제거 및 정보 그룹화
          const orderNoGroups = {};
          cancelledOrders.forEach(o => {
            if (!orderNoGroups[o.orderNo]) {
              orderNoGroups[o.orderNo] = {
                orderNo: o.orderNo,
                nickname: o.nickname,
                cancelTimestamp: o.cancelTimestamp,
                cancelReason: o.cancelReason
              };
            }
          });
          
          Object.values(orderNoGroups).forEach(group => {
            if (!group.cancelTimestamp) return;
            const cancelTime = new Date(group.cancelTimestamp);
            const diffMs = now.getTime() - cancelTime.getTime();
            
            // 3분(180초) 이내의 취소 건이면서 아직 dismiss 처리되지 않은 주문
            if (Math.abs(diffMs) <= 180000 && !dismissedList.includes(group.orderNo)) {
              activeCancellations.push(group);

              // 소리 및 TTS 재생 유무 확인 (첫 노출 시 단 1회만 재생)
              if (!window.playedWarningSoundIds) {
                window.playedWarningSoundIds = [];
              }
              if (!window.playedWarningSoundIds.includes(group.orderNo)) {
                window.playedWarningSoundIds.push(group.orderNo);
                playedSound = true;
                newlyCancelledNicknames.push(group.nickname);
              }
            }
          });
          
          if (playedSound) {
            AppState.playWarningSound();
            if (newlyCancelledNicknames.length > 0) {
              const names = newlyCancelledNicknames.join(', ');
              AppState.speak(`${names} 님의 주문이 취소되었습니다.`);
            }
          }
          
          renderCancellationBanner(activeCancellations);
        }
      } catch (e) {
        console.warn('취소 주문 폴링 에러:', e);
      } finally {
        cancellationPollInFlight = false;
        scheduleCancellationPolling();
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !cancellationPollingActive) return;
      if (cancellationInterval) clearTimeout(cancellationInterval);
      checkCancelledOrders();
    });

    // 내 실시간 주문 상태 표시 및 음성 호출 기능
    function checkMyOrderStatus(orders) {
      const summaryStr = localStorage.getItem('lastOrderSummary');
      const container = document.getElementById('order-status-banner-container');
      if (!summaryStr || !container) {
        if (container) container.style.display = 'none';
        return;
      }

      const summary = JSON.parse(summaryStr);
      if (!summary.orderNo) {
        container.style.display = 'none';
        return;
      }

      // 오늘 내 주문과 일치하는 항목 필터링
      const myItems = orders.filter(o => o.orderNo === summary.orderNo);
      if (myItems.length === 0) {
        container.style.display = 'none';
        return;
      }

      const status = myItems[0].servedYn || 'N';

      // 수령완료(Y) 또는 취소(C)인 경우 10초 후에 캐시 비우고 배너 숨김
      if (status === 'Y' || status === 'C') {
        if (!window.bannerRemoveTimeout) {
          window.bannerRemoveTimeout = setTimeout(() => {
            const currentSummary = localStorage.getItem('lastOrderSummary');
            if (currentSummary) {
              const parsed = JSON.parse(currentSummary);
              if (parsed.orderNo === summary.orderNo) {
                localStorage.removeItem('lastOrderSummary');
                container.style.display = 'none';
              }
            }
            window.bannerRemoveTimeout = null;
          }, 10000);
        }
      } else {
        // 대기중/준비중일 때는 타이머 해제
        if (window.bannerRemoveTimeout) {
          clearTimeout(window.bannerRemoveTimeout);
          window.bannerRemoveTimeout = null;
        }
      }

      const method = myItems[0].deliveryType || 'pickup';
      const isDelivery = method === 'delivery';

      // 상태별 라벨 및 색상
      let statusText = '접수중';
      let statusColor = '#3A86C8'; // blue
      let styleCss = '';
      let animeClass = '';

      if (status === 'P') {
        statusText = '준비중 ☕';
        statusColor = 'var(--primary-color)'; // orange
      } else if (status === 'R') {
        statusText = isDelivery ? '배달중 🛵 (조금만 기다려주세요!)' : '준비완료 🔔 (받아가세요!)';
        statusColor = 'var(--secondary-hover)'; // mint
        styleCss = 'background-color: #E0F2F1; border-bottom: 4px solid var(--secondary-color); font-size: 22px;';
        animeClass = 'animation: pulseGlowBanner 1.5s infinite ease-in-out;';

        // 준비완료 첫 감지 시 TTS 안내
        if (window.lastAnnouncedOrderNo !== summary.orderNo) {
          window.lastAnnouncedOrderNo = summary.orderNo;
          AppState.playClickSound();
          if (isDelivery) {
            AppState.speak(`${summary.nickname} 님, 주문하신 간식이 배달 중입니다. 조금만 기다려주세요!`);
          } else {
            AppState.speak(`${summary.nickname} 님, 주문하신 간식이 준비되었습니다. 받아가세요!`);
          }
          AppState.vibrate([100, 50, 100]);
        }
      } else if (status === 'Y') {
        statusText = isDelivery ? '배달완료 📦 맛있게 드세요!' : '수령완료 📦 맛있게 드세요!';
        statusColor = 'var(--text-muted)';
        styleCss = 'background-color: #F8F9FA;';
      } else if (status === 'C') {
        statusText = '주문취소 ❌ 환불 처리 완료';
        statusColor = 'var(--danger-color)';
        styleCss = 'background-color: #FFF0F0; border-bottom-color: var(--danger-color);';
      }

      container.style.display = 'block';
      container.style.cssText = `display: block; padding: 16px 20px; text-align: center; border-bottom: 4px solid ${statusColor}; background-color: #FFFDF9; ${styleCss} ${animeClass}`;

      const shortNo = getShortOrderNo(summary.orderNo);
      container.innerHTML = `
        <div style="font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;">
          <span>✨ 실시간 주문 현황:</span>
          <span style="color: var(--primary-color); font-size: 24px; font-weight: 900;">[${shortNo}번]</span>
          <span>현재</span>
          <span style="color: ${statusColor}; font-size: 24px; font-weight: 950;">${statusText}</span>
        </div>
      `;
    }

    function getShortOrderNo(orderNo) {
      if (!orderNo) return '-';
      const parts = orderNo.split('-');
      if (parts.length >= 3) {
        return parseInt(parts[2], 10);
      }
      return orderNo;
    }

    function renderCancellationBanner(activeCancellations) {
      const banner = document.getElementById('cancellation-banner-container');
      if (!banner) return;

      if (activeCancellations.length === 0) {
        banner.style.display = 'none';
        banner.innerHTML = '';
        return;
      }

      banner.style.display = 'flex';
      banner.innerHTML = activeCancellations.map(c => {
        const reasonHtml = c.cancelReason ? `<div style="font-size: 16px; font-weight: 700; color: var(--danger-color); margin-top: 4px;">사유: ${AppState.escapeHtml(c.cancelReason)}</div>` : '';
        return `
        <div class="cancellation-row" style="font-size: 20px; font-weight: 800; color: #9B2C2C; padding: 8px 0; display: flex; flex-direction: column; align-items: center; border-bottom: 1px dashed rgba(155, 44, 44, 0.2);">
          <div>📢 <span style="color: var(--danger-color); font-size: 22px;">${AppState.escapeHtml(c.nickname)} 님</span>의 주문이 취소되었습니다.</div>
          ${reasonHtml}
        </div>
        `;
      }).join('');

      // 60초 타이머 설정하여 각 주문번호를 dismiss 리스트에 등록
      activeCancellations.forEach(c => {
        if (!window.activeCancellationTimers) {
          window.activeCancellationTimers = {};
        }
        
        if (!window.activeCancellationTimers[c.orderNo]) {
          window.activeCancellationTimers[c.orderNo] = setTimeout(() => {
            const currentDismissed = JSON.parse(localStorage.getItem('dismissedCancellations') || '[]');
            if (!currentDismissed.includes(c.orderNo)) {
              currentDismissed.push(c.orderNo);
              localStorage.setItem('dismissedCancellations', JSON.stringify(currentDismissed));
            }
            delete window.activeCancellationTimers[c.orderNo];
            checkCancelledOrders(); // 즉시 화면 갱신
          }, 60000); // 60초 간 노출
        }
      });
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      // 혹시 남아있을 기존 장바구니/선택유저 데이터 초기화
      AppState.resetAll();
      
      loadUsers();

      // 게스트 버튼 바인딩
      const guestBtn = document.getElementById('btn-guest-mode');
      if (guestBtn) {
        AppState.bindCardTap(guestBtn, () => {
          AppState.vibrate(50);
          window.location.href = 'guest.html';
        });
      }

      // 취소 알림 설정 초기화 및 첫 폴링 스케줄링 (즉시 중복 호출 방지)
      initCancellationAlerts().then(() => {
        cancellationPollingActive = true;
        scheduleCancellationPolling();
      });

      // TTS 토글 연동 및 초기설정
      const ttsToggle = document.getElementById('tts-toggle');
      if (ttsToggle) {
        ttsToggle.checked = AppState.isTtsEnabled();
        ttsToggle.addEventListener('change', (e) => {
          AppState.setTtsEnabled(e.target.checked);
          AppState.vibrate(40);
          if (e.target.checked) {
            AppState.speak("음성 안내를 켭니다.");
          } else {
            window.speechSynthesis.cancel();
          }
        });
      }

      // 주문번호 상시 발급으로 고정
      localStorage.setItem('orderNoEnabled', 'true');

      // 친절 안내 모달 닫기 버튼 및 배경 바인딩
      const friendlyNoticeCloseBtn = document.getElementById('btn-friendly-notice-close');
      if (friendlyNoticeCloseBtn) {
        AppState.bindCardTap(friendlyNoticeCloseBtn, () => {
          AppState.vibrate(30);
          closeFriendlyNotice();
        });
      }

      const friendlyNoticeOverlay = document.getElementById('friendly-notice-overlay');
      if (friendlyNoticeOverlay) {
        friendlyNoticeOverlay.addEventListener('click', (e) => {
          if (e.target === friendlyNoticeOverlay) {
            closeFriendlyNotice();
          }
        });
      }

      // 직원 우회 확인 모달 버튼 및 배경 바인딩
      const staffBypassConfirmBtn = document.getElementById('btn-staff-bypass-confirm');
      if (staffBypassConfirmBtn) {
        AppState.bindCardTap(staffBypassConfirmBtn, () => {
          confirmStaffBypass();
        });
      }
      const staffBypassCancelBtn = document.getElementById('btn-staff-bypass-cancel');
      if (staffBypassCancelBtn) {
        AppState.bindCardTap(staffBypassCancelBtn, () => {
          AppState.vibrate(30);
          closeStaffBypassModal();
        });
      }
      const staffBypassOverlay = document.getElementById('staff-bypass-overlay');
      if (staffBypassOverlay) {
        staffBypassOverlay.addEventListener('click', (e) => {
          if (e.target === staffBypassOverlay) {
            closeStaffBypassModal();
          }
        });
      }

      const kioskRegisterOverlay = document.getElementById('kiosk-register-overlay');
      if (kioskRegisterOverlay) {
        kioskRegisterOverlay.addEventListener('click', (e) => {
          if (e.target === kioskRegisterOverlay) {
            closeKioskRegisterModal();
          }
        });
      }

      // 다시 시도 버튼 바인딩
      document.getElementById('btn-retry').addEventListener('click', () => {
        loadUsers();
      });
    });
  </script>
</body>
</html>
